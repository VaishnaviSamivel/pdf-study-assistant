<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - PDF Chatbot Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-icon-large">
                    <i class="fa-solid fa-lock-open"></i>
                </div>
                <h2>Set New Password</h2>
                <p class="auth-subtitle">Choose a new password for account: <strong>{{ username }}</strong></p>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-container">
                        {% for category, message in messages %}
                            <div class="flash-message {{ category }}">
                                <i class="fa-solid {% if category == 'error' %}fa-circle-exclamation{% elif category == 'success' %}fa-circle-check{% else %}fa-circle-info{% endif %}"></i>
                                <span>{{ message }}</span>
                                <button onclick="this.parentElement.remove()" class="close-flash">&times;</button>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('reset_password', token=token) }}" method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
                    </div>
                    <span class="field-hint"><i class="fa-solid fa-shield-halved"></i> Must be at least 8 characters long</span>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock-check input-icon"></i>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required minlength="8">
                    </div>
                </div>

                <button type="submit" class="btn-auth-primary">
                    <span>Update Password</span>
                    <i class="fa-solid fa-check-double"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p><a href="{{ url_for('login') }}" class="auth-link">Back to Sign In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
